[package]
name = "traceforge-gateway"
version = "0.1.0"
edition = "2021"

# Rust 数据面 (axum 服务)。当前: src/main.rs 提供 /healthz /readyz 健康检查,
# examples/sqlx_smoke.rs 作双 ORM 编译期闸门; 代理转发 + SSE 透传 + 限流 + Trace 采集按 PRD Stage 1+ 展开。

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dotenvy = "0.15"
anyhow = "1"
