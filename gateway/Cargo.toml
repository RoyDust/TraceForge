[package]
name = "traceforge-gateway"
version = "0.1.0"
edition = "2021"

# Rust 数据面 (axum 服务)。当前: src/main.rs 提供 /healthz /readyz 健康检查,
# examples/sqlx_smoke.rs 作双 ORM 编译期闸门; 代理转发 + SSE 透传 + 限流 + Trace 采集按 PRD Stage 1+ 展开。

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "uuid", "chrono"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dotenvy = "0.15"
anyhow = "1"
regex = "1"
tiktoken-rs = "0.12.0"
