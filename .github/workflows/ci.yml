name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-sqlx-sync:
    name: Schema, Console and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: traceforge
          POSTGRES_PASSWORD: traceforge
          POSTGRES_DB: traceforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://traceforge:traceforge@localhost:5432/traceforge
      TEST_DATABASE_URL: postgresql://traceforge:traceforge@localhost:5432/traceforge
      ADMIN_EMAIL: smoke@example.com
      ADMIN_PASSWORD_HASH: plain:e2e-local-password
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      # 在干净 PostgreSQL 上应用同一套已提交迁移。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prisma validate
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # 数据面: sqlx query! 宏在编译期连库校验。Rust SQL 与 Prisma schema 不一致 -> 构建失败。
      # query! 宏在 examples/sqlx_smoke.rs, 故必须带 --examples 才能触发闸门 (--bins 编主服务)。
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway
      - working-directory: gateway
        run: cargo build --bins --examples
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Record dependency audit without forced remediation
        if: always()
        run: npm audit --json > dependency-audit.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            playwright-report/
            test-results/
            dependency-audit.json
          retention-days: 7
