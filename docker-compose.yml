services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: traceforge
      POSTGRES_PASSWORD: traceforge
      POSTGRES_DB: traceforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceforge -d traceforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  console:
    build:
      context: .
      dockerfile: Dockerfile.console
    environment:
      DATABASE_URL: postgresql://traceforge:traceforge@postgres:5432/traceforge
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD_HASH: plain:stage3-local-admin
      TRACEFORGE_EVAL_GATEWAY_URL: http://gateway:8787
      TRACEFORGE_EVAL_API_KEY: tf-stage6-eval-key
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      DATABASE_URL: postgresql://traceforge:traceforge@postgres:5432/traceforge
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      GATEWAY_ADDR: 0.0.0.0:8787
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy

  mock-upstream:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command: ["cargo", "run", "--release", "--bin", "mock_upstream"]
    environment:
      MOCK_ADDR: 0.0.0.0:8799
    ports:
      - "8799:8799"

volumes:
  postgres-data:
