# Run from the repository root with --env-file <production.env>.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: traceforge
      POSTGRES_DB: traceforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a production database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceforge -d traceforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile.console
      target: tools
    environment:
      DATABASE_URL: ${DATABASE_URL:?Use the internal postgres hostname}
      DEMO_MODE: "false"
      TRACEFORGE_PROJECT_ID: ${TRACEFORGE_PROJECT_ID:?Set a project UUID}
      TRACEFORGE_PROJECT_NAME: ${TRACEFORGE_PROJECT_NAME:?Set a project name}
      TRACEFORGE_CHAT_API_KEY: ${TRACEFORGE_CHAT_API_KEY:?Register a project key}
      TRACEFORGE_EVAL_API_KEY: ${TRACEFORGE_EVAL_API_KEY:?Register a project key}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?Set the encryption key}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${TRACEFORGE_CHAT_MODEL:?Set the active model}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  console:
    build:
      context: ..
      dockerfile: Dockerfile.console
    environment:
      DATABASE_URL: ${DATABASE_URL:?Use the internal postgres hostname}
      DEMO_MODE: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set administrator email}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set administrator password hash}
      TRACEFORGE_CHAT_GATEWAY_URL: http://gateway:8787
      TRACEFORGE_CHAT_API_KEY: ${TRACEFORGE_CHAT_API_KEY:?Register a project key}
      TRACEFORGE_CHAT_MODEL: ${TRACEFORGE_CHAT_MODEL:?Set the active model}
      TRACEFORGE_CHAT_TIMEOUT_MS: ${TRACEFORGE_CHAT_TIMEOUT_MS:-30000}
      TRACEFORGE_EVAL_GATEWAY_URL: http://gateway:8787
      TRACEFORGE_EVAL_API_KEY: ${TRACEFORGE_EVAL_API_KEY:?Register a project key}
      TRACEFORGE_EVAL_TIMEOUT_MS: ${TRACEFORGE_EVAL_TIMEOUT_MS:-30000}
      TRACEFORGE_EVAL_MAX_CASES: ${TRACEFORGE_EVAL_MAX_CASES:-20}
      TRACEFORGE_EVAL_TOTAL_TIMEOUT_MS: ${TRACEFORGE_EVAL_TOTAL_TIMEOUT_MS:-120000}
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Use the internal postgres hostname}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?Set the existing encryption key}
      GATEWAY_ADDR: 0.0.0.0:8787
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONFIG_PATH:?Set an absolute nginx config path}:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?Set an absolute certificate directory}:/etc/nginx/certs:ro
    depends_on:
      - console
    restart: unless-stopped

volumes:
  postgres-data:
